server {
    listen 80;

    # Docker's internal DNS. Re-resolving every 10s means nginx picks up
    # new container IPs after a redeploy instead of returning 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $calculator_upstream http://calculator:8000;

    location / {
        proxy_pass $calculator_upstream;
        add_header X-Upstream $upstream_addr always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    location = /nginx-health {
        return 200 "ok\n";
    }
}
