name: calculator   # fixed project name, so re-runs from Jenkins update the same stack

services:
  calculator:
    image: ${DOCKER_IMAGE:-satyamdevang/calculator}:${IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: "8000"
      SPRING_PROFILES_ACTIVE: "prod"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    expose:
      - "8000"
    deploy:
      replicas: 2
    restart: unless-stopped
    networks:
      - calc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"   # VM port 8081 -> nginx; 8080 = Jenkins, 8000 = local app testing
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  calc-net:
    driver: bridge
